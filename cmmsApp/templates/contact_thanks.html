<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="robots"
    content="noindex"
  >

  <title>
    Thank you | iEread
  </title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;

      min-height: 100vh;

      display: grid;
      place-items: center;

      padding: 24px;

      font-family:
        system-ui,
        -apple-system,
        "Segoe UI",
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #061f39 0%,
          #0a2c52 100%
        );

      color: #ffffff;
    }


    body::before {
      content: "";

      position: fixed;

      inset: 0;

      background:
        radial-gradient(
          circle at 82% 18%,
          rgba(81, 69, 229, 0.35),
          transparent 42%
        );

      pointer-events: none;
    }


    .cmms-contact-form-thanks {
      position: relative;

      width: min(
        100%,
        610px
      );

      padding:
        clamp(
          32px,
          6vw,
          64px
        );

      border:
        1px solid
        rgba(255, 255, 255, 0.14);

      border-radius: 22px;

      background:
        rgba(
          11,
          40,
          72,
          0.92
        );

      box-shadow:
        0 24px 70px
        rgba(0, 0, 0, 0.28);

      text-align: center;
    }


    /* Brand */

    .brand {
      display: inline-block;

      margin-bottom: 32px;

      font-size: 25px;

      font-weight: 800;

      letter-spacing: -0.055em;
    }


    .brand .ie {
      color: #38bdf8;
    }


    .brand .read {
      color: #ffffff;
    }


    /* Check */

    .check {
      display: grid;
      place-items: center;

      width: 72px;
      height: 72px;

      margin:
        0 auto 24px;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #38bdf8,
          #5145e5
        );

      color: #ffffff;

      font-size: 34px;

      font-weight: 800;

      box-shadow:
        0 12px 30px
        rgba(81, 69, 229, 0.30);
    }


    /* Heading */

    h1 {
      margin:
        0 0 15px;

      font-size:
        clamp(
          30px,
          5vw,
          45px
        );

      line-height: 1.15;

      letter-spacing:
        -0.04em;
    }


    /* Text */

    p {
      max-width: 470px;

      margin:
        0 auto 32px;

      color: #c2d2e5;

      font-size: 16px;

      line-height: 1.7;
    }


    /* Return Button */

    .cmms-contact-form-back {
      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 9px;

      padding:
        13px 24px;

      border-radius: 10px;

      background:
        linear-gradient(
          135deg,
          #1473e6,
          #5145e5
        );

      color: #ffffff;

      font-weight: 800;

      text-decoration: none;

      box-shadow:
        0 10px 25px
        rgba(81, 69, 229, 0.26);

      transition:
        transform .2s ease,
        box-shadow .2s ease,
        background .2s ease;
    }


    .cmms-contact-form-back:hover {
      transform:
        translateY(-2px);

      box-shadow:
        0 15px 32px
        rgba(81, 69, 229, 0.34);

      background:
        linear-gradient(
          135deg,
          #0d68dc,
          #4338ca
        );
    }


    .cmms-contact-form-back:focus-visible {
      outline:
        3px solid
        #ffffff;

      outline-offset: 4px;
    }


    @media (
      max-width: 520px
    ) {

      .cmms-contact-form-thanks {
        padding:
          34px 22px;
      }


      .brand {
        margin-bottom: 25px;
      }


      .check {
        width: 64px;
        height: 64px;

        font-size: 30px;
      }

    }

  </style>

</head>


<body>

  <main class="cmms-contact-form-thanks">


    <div
      class="brand"
      aria-label="iEread"
    >

      <span class="ie">
        iE
      </span>

      <span class="read">
        read
      </span>

    </div>


    <div
      class="check"
      aria-hidden="true"
    >
      ✓
    </div>


    <h1>
      Thank you for reaching out.
    </h1>


    <p>
      We’ve received your iEread enquiry.
      Our team will review your message and
      get back to you using the contact details
      you provided.
    </p>


    <a
      href="/"
      class="cmms-contact-form-back"
    >

      Return to iEread

      <span aria-hidden="true">
        →
      </span>

    </a>


  </main>

</body>

</html>
