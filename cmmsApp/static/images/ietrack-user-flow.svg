<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1270" viewBox="0 0 2400 1270" role="img" aria-labelledby="title desc">
<title id="title">iEtrack current user flow</title><desc id="desc">Employee agent starts, punch in, automatic activity tracking, punch out, and SQL reports. Optional manual activity, idle screenshots, and authorised on-demand live screen branch from tracking.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f3f8fc"/><stop offset="1" stop-color="#e8f6f3"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f3452" flood-opacity=".13"/></filter><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#147f91" stroke-width="2.5"/></marker></defs>
<rect width="2400" height="1270" fill="url(#bg)"/>
<rect x="60" y="48" width="2280" height="135" rx="30" fill="#112f55"/>
<text x="112" y="111" font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="white">iEtrack | How a workday flows</text>
<text x="112" y="153" font-family="Arial, sans-serif" font-size="26" fill="#aee8e1">Current agent flow: attendance, activity, optional context and live visibility</text>
<rect x="90" y="260" width="340" height="230" rx="22" fill="white" stroke="#d3e4eb" stroke-width="2" filter="url(#shadow)"/>
<rect x="90" y="260" width="340" height="9" rx="5" fill="#1a69bf"/>
<circle cx="137" cy="319" r="27" fill="#1a69bf"/>
<text x="127" y="329" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="white">1</text>
<text x="176" y="329" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#142f46">Agent starts</text>
<text x="127" y="379" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#344b59">Runs in background</text>
<text x="127" y="419" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#344b59">on the employee PC.</text>
<rect x="560" y="260" width="340" height="230" rx="22" fill="white" stroke="#d3e4eb" stroke-width="2" filter="url(#shadow)"/>
<rect x="560" y="260" width="340" height="9" rx="5" fill="#129351"/>
<circle cx="607" cy="319" r="27" fill="#129351"/>
<text x="597" y="329" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="white">2</text>
<text x="646" y="329" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#142f46">Punch in</text>
<text x="597" y="379" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#344b59">Marks the workday</text>
<text x="597" y="419" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#344b59">and records attendance.</text>
<rect x="1030" y="260" width="340" height="230" rx="22" fill="white" stroke="#d3e4eb" stroke-width="2" filter="url(#shadow)"/>
<rect x="1030" y="260" width="340" height="9" rx="5" fill="#0b8e9c"/>
<circle cx="1077" cy="319" r="27" fill="#0b8e9c"/>
<text x="1067" y="329" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="white">3</text>
<text x="1116" y="329" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#142f46">Activity tracking</text>
<text x="1067" y="379" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#344b59">Records app or tab changes</text>
<text x="1067" y="419" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#344b59">even before punch in.</text>
<rect x="1500" y="260" width="340" height="230" rx="22" fill="white" stroke="#d3e4eb" stroke-width="2" filter="url(#shadow)"/>
<rect x="1500" y="260" width="340" height="9" rx="5" fill="#d4791c"/>
<circle cx="1547" cy="319" r="27" fill="#d4791c"/>
<text x="1537" y="329" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="white">4</text>
<text x="1586" y="329" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#142f46">Punch out</text>
<text x="1537" y="379" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#344b59">Confirms end of day</text>
<text x="1537" y="419" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#344b59">and total working time.</text>
<rect x="1970" y="260" width="340" height="230" rx="22" fill="white" stroke="#d3e4eb" stroke-width="2" filter="url(#shadow)"/>
<rect x="1970" y="260" width="340" height="9" rx="5" fill="#7255bb"/>
<circle cx="2017" cy="319" r="27" fill="#7255bb"/>
<text x="2007" y="329" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="white">5</text>
<text x="2056" y="329" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#142f46">Reports</text>
<text x="2007" y="379" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#344b59">Activity and attendance</text>
<text x="2007" y="419" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#344b59">reach SQL via the API.</text>
<path d="M442 375 L537 375" fill="none" stroke="#147f91" stroke-width="4" marker-end="url(#arr)"/>
<path d="M912 375 L1007 375" fill="none" stroke="#147f91" stroke-width="4" marker-end="url(#arr)"/>
<path d="M1382 375 L1477 375" fill="none" stroke="#147f91" stroke-width="4" marker-end="url(#arr)"/>
<path d="M1852 375 L1947 375" fill="none" stroke="#147f91" stroke-width="4" marker-end="url(#arr)"/>
<text x="95" y="576" font-family="Arial, sans-serif" font-size="37" font-weight="700" fill="#142f46">Optional paths while the agent is running</text>
<rect x="90" y="650" width="420" height="320" rx="22" fill="white" stroke="#d3e4eb" stroke-width="2" filter="url(#shadow)"/>
<rect x="90" y="650" width="420" height="9" rx="5" fill="#168c98"/>
<circle cx="137" cy="709" r="27" fill="#168c98"/>
<text x="127" y="719" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="white">•</text>
<text x="176" y="719" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#142f46">Manual activities</text>
<text x="127" y="769" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#344b59">Employee selects a reason</text>
<text x="127" y="809" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#344b59">for work away from the PC.</text>
<text x="127" y="849" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#344b59">Select again to end it.</text>
<rect x="560" y="650" width="420" height="320" rx="22" fill="white" stroke="#d3e4eb" stroke-width="2" filter="url(#shadow)"/>
<rect x="560" y="650" width="420" height="9" rx="5" fill="#db8323"/>
<circle cx="607" cy="709" r="27" fill="#db8323"/>
<text x="597" y="719" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="white">•</text>
<text x="646" y="719" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#142f46">Idle and screenshots</text>
<text x="597" y="769" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#344b59">After 2.5 minutes idle:</text>
<text x="597" y="809" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#344b59">IDLE_START capture.</text>
<text x="597" y="849" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#344b59">On return: BACK_TO_WORK.</text>
<rect x="1030" y="650" width="420" height="320" rx="22" fill="white" stroke="#d3e4eb" stroke-width="2" filter="url(#shadow)"/>
<rect x="1030" y="650" width="420" height="9" rx="5" fill="#7357c6"/>
<circle cx="1077" cy="709" r="27" fill="#7357c6"/>
<text x="1067" y="719" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="white">•</text>
<text x="1116" y="719" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#142f46">Live screen</text>
<text x="1067" y="769" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#344b59">An authorised viewer opens</text>
<text x="1067" y="809" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#344b59">a live view on demand.</text>
<text x="1067" y="849" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#344b59">Video is not recorded.</text>
<rect x="1500" y="650" width="420" height="320" rx="22" fill="white" stroke="#d3e4eb" stroke-width="2" filter="url(#shadow)"/>
<rect x="1500" y="650" width="420" height="9" rx="5" fill="#276cb5"/>
<circle cx="1547" cy="709" r="27" fill="#276cb5"/>
<text x="1537" y="719" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="white">•</text>
<text x="1586" y="719" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#142f46">Screen preview</text>
<text x="1537" y="769" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#344b59">Latest small preview</text>
<text x="1537" y="809" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#344b59">is kept in memory.</text>
<text x="1537" y="849" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#344b59">Separate from screenshots.</text>
<path d="M1200 505 L1200 615 L300 615 L300 631 M1200 615 L770 631 M1200 615 L1240 631 M1200 615 L1710 631" fill="none" stroke="#8aa9b6" stroke-width="3" stroke-dasharray="8 8"/>
<rect x="90" y="1025" width="2220" height="165" rx="24" fill="#e0f1ef" stroke="#b0dbd4"/>
<text x="128" y="1081" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#103d48">Where records go</text>
<text x="128" y="1126" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#344b59">Activity, punch events and the two idle screenshots are queued for API upload to SQL Server.</text>
<text x="128" y="1165" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#344b59">Live video and the small preview remain separate from screenshot history and SQL records.</text>
</svg>